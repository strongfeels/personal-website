<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="A walkable 3D Clonskeagh, Dublin — built from OpenStreetMap geometry and satellite imagery. Walk it, drive it, watch the Luas go by.">
<meta property="og:title" content="Clonskeagh in 3D">
<meta property="og:description" content="Four square kilometres of south Dublin, built from real map data.">
<link rel="icon" href="./favicon.svg">
<title>Clonskeagh — Gledswood Avenue</title>
<link rel="stylesheet" href="./game.css">
<script src="./boot.js"></script>
</head>
<body>
<canvas id="view"></canvas>

<div class="hud" id="street"></div>
<div class="hud" id="place"></div>
<div class="hud" id="clock">☀️ Afternoon</div>
<div class="hud" id="stats"></div>
<div class="hud" id="prompt"></div>
<div class="hud" id="audio">🔊 click for sound</div>
<div class="hud" id="speed">0<small>KM/H</small></div>
<canvas id="minimap" width="512" height="512"></canvas>
<div class="hud" id="credit">Geometry © OpenStreetMap contributors (ODbL) · vegetation traced from Esri World Imagery</div>

<div id="help">
  <kbd>WASD move</kbd><kbd>Shift run</kbd><kbd>Space jump</kbd><kbd>Drag look</kbd>
  <kbd>Scroll zoom</kbd><kbd>C first-person</kbd><kbd>N time of day</kbd><kbd>M map</kbd>
  <kbd>E enter / exit car</kbd><kbd>P mute</kbd><kbd>R respawn</kbd><kbd>H hide</kbd>
</div>

<div id="loading">
  <h1>Clonskeagh<span>.</span></h1>
  <p id="loading-text">Starting up…</p>
  <div class="bar"><i></i></div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
